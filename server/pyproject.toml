[project]
name = "its-compile-service"
version = "0.1.0"
description = "HTTP compile service wrapping the its-compiler reference implementation"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.111",
    "its-compiler",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
its-compiler = { index = "testpypi" }
