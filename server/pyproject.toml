[project]
name = "its-compile-service"
version = "0.1.0"
description = "HTTP compile service wrapping the its-compiler reference implementation"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.111",
    # 1.2.1 is the first release rendering scalars identically to the other
    # compilers. Bounded below the next major, which may change that output.
    "its-compiler>=1.2.1,<2.0.0",
]
